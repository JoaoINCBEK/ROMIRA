<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1200" width="1500" height="1200" role="img" aria-label="Espreguiçadeira com toalha e chapéu sob o sol" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Espreguiçadeira com toalha e chapéu sob o sol (ilustração)</title>

<defs>
  <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dcb8"/><stop offset="1" stop-color="#e4c497"/></linearGradient>
  <radialGradient id="sol" cx=".78" cy=".22" r=".5"><stop offset="0" stop-color="#fff4dc"/><stop offset=".3" stop-color="#ffe0ad" stop-opacity=".7"/><stop offset="1" stop-color="#ffe0ad" stop-opacity="0"/></radialGradient>
  
  <filter id="grao" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .15  0 0 0 0 .13  0 0 0 0 .08  0 0 0 0.09 0"/>
  </filter>
</defs>
<rect width="1500" height="1200" fill="url(#fundo)"/>
<rect width="1500" height="1200" fill="url(#sol)"/>
<circle cx="1170" cy="260" r="110" fill="#fff6e3"/>
<!-- sombra das folhas -->
<g opacity=".16"><g transform="translate(-60 140) rotate(20)">
    <path d="M0 0C155 -120 465 -108 620 0C465 108 155 120 0 0Z" fill="#3f4a2f"/>
    <path d="M0 0L620 0" stroke="transparent" stroke-width="2"/>
    <path d="M68.9 0L98.9 -24.5M68.9 0L98.9 24.5M137.8 0L167.8 -42.6M137.8 0L167.8 42.6M206.7 0L236.7 -56M206.7 0L236.7 56M275.6 0L305.6 -63.1M275.6 0L305.6 63.1M344.4 0L374.4 -63.1M344.4 0L374.4 63.1M413.3 0L443.3 -56M413.3 0L443.3 56M482.2 0L512.2 -42.6M482.2 0L512.2 42.6M551.1 0L581.1 -24.5M551.1 0L581.1 24.5" stroke="transparent" stroke-width="1.2"/>
  </g><g transform="translate(-80 360) rotate(8)">
    <path d="M0 0C130 -100 390 -90 520 0C390 90 130 100 0 0Z" fill="#3f4a2f"/>
    <path d="M0 0L520 0" stroke="transparent" stroke-width="2"/>
    <path d="M57.8 0L82.8 -21.1M57.8 0L82.8 21.1M115.6 0L140.6 -36.1M115.6 0L140.6 36.1M173.3 0L198.3 -47.3M173.3 0L198.3 47.3M231.1 0L256.1 -53.2M231.1 0L256.1 53.2M288.9 0L313.9 -53.2M288.9 0L313.9 53.2M346.7 0L371.7 -47.3M346.7 0L371.7 47.3M404.4 0L429.4 -36.1M404.4 0L429.4 36.1M462.2 0L487.2 -21.1M462.2 0L487.2 21.1" stroke="transparent" stroke-width="1.2"/>
  </g></g>
<rect x="0" y="760" width="1500" height="440" fill="#d7b98f"/>
<path d="M0 760 H1500" stroke="#f3e3c8" stroke-width="6"/>
<!-- espreguiçadeira -->
<g transform="translate(330 760)">
  <path d="M0 40 L560 40 L760 -170 L800 -150 L610 70 L0 70Z" fill="#f6ecdb"/>
  <path d="M40 40 L560 40 L740 -150" stroke="#e1cfb0" stroke-width="6" fill="none"/>
  <rect x="30" y="70" width="18" height="70" fill="#7a5a3a"/><rect x="540" y="70" width="18" height="70" fill="#7a5a3a"/>
  <!-- toalha dobrada -->
  <path d="M120 10 H420 V40 H120Z" fill="#b98a55"/><path d="M120 10 H420 V20 H120Z" fill="#d1a473"/>
  <path d="M150 10 v30 M390 10 v30" stroke="#f3e3c8" stroke-width="4"/>
</g>
<!-- chapéu -->
<g transform="translate(1250 900)">
  <ellipse cx="0" cy="0" rx="190" ry="44" fill="#c99a63"/><ellipse cx="0" cy="-6" rx="150" ry="30" fill="#d9b07a"/>
  <path d="M-90 -6 C-90 -110 90 -110 90 -6Z" fill="#c99a63"/><path d="M-88 -30 C-40 -20 40 -20 88 -30 L90 -6 C40 2 -40 2 -90 -6Z" fill="#5c4a35"/>
</g>
<!-- óculos de sol e protetor -->
<g transform="translate(1030 1010)"><rect x="-30" y="-120" width="60" height="140" rx="16" fill="#f3e3c8"/><rect x="-18" y="-140" width="36" height="26" rx="6" fill="#a06d3a"/></g>
<rect width="1500" height="1200" filter="url(#grao)"/>

</svg>
