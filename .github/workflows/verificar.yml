# Verifica o site a cada envio ao GitHub: compila e roda os testes.
# A publicação em si é feita pela Cloudflare Pages (veja o README).
name: Verificar site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-testes
          path: test-results/
          retention-days: 7
